[project]
name = "agent-gateway-entra"
version = "0.1.0"
description = "Agent Platform Demo with Agent Gateway and Entra Agent ID"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-auth>=2.29.0",
    "google-cloud-bigquery>=3.20.0",
    "google-cloud-storage>=2.16.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "requests>=2.31.0",
    "pyjwt[crypto]>=2.8.0",
    "google-adk[gcp,otel-gcp]>=2.6.0",
    "a2a-sdk[http-server]>=1.0",
    "google-cloud-aiplatform[agent-engines,evaluation]>=1.156.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
